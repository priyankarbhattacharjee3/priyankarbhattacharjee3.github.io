    Publications:
      - title: Older adults and their acquisition of digital skills- A review of current research evidence
        authors:
          - Priyankar Bhattacharjee
          - Steven Baker
          - Jenny Waycott
        publisher: ACM
        releaseDate: 2021-02-15
        url: https://dl.acm.org/doi/10.1145/3441000.3441053
        summary: Conducted a systematic literature review of 22 articles examining challenges older adults face when learning digital skills. Identified five primary barrier categories- age-related factors, technology design issues, low self-efficacy, negative societal attitudes, and inadequate training materials. Found that learning challenges often trigger anxiety and fear, undermining confidence in technology use. Proposed recommendations for improving digital skills training to better support older adult learners.

      - title: VCare- A Personal Emergency Response System to Promote Safe and Independent Living Among Elders Staying by Themselves in Community or Residential Settings
        authors:
          - Priyankar Bhattacharjee
        publisher: Digital Commons, University of Nebraska-Lincoln
        releaseDate: 2015-05-01
        url: https://digitalcommons.unl.edu/ceendiss/32/
        summary: This thesis proposes an information and communication technology (ICT) solution for remote monitoring of older individuals. The work presents a robust, cost-effective, and secure system design that enables caregivers to monitor functional status and receive alerts during emergencies, while mitigating data security risks and service costs. The research contributes to the field of technology-assisted independent living by offering solutions that reduce caregiver burden and support ageing in place.

      - title: Workplace monitoring of employee health using the workstation PC as a platform
        authors:
          - Priyankar Bhattacharjee
        publisher: IEEE
        releaseDate: 2015-02-12
        url: https://ieeexplore.ieee.org/document/7038923
        summary: This work proposed a novel approach to healthcare monitoring that utilizes office workstation PCs to track employee health, reducing reliance on wearable devices and traditional telehealth systems. Demonstrated how this technology can minimize doctor visits during work hours, decrease dependency on institutional healthcare settings for routine check-ups, and enable early detection of health deterioration. The research shows potential for reducing sick leave, improving employee productivity, and lowering healthcare expenditures by facilitating timely interventions for chronic illness management in the workplace.

      - title: The Computer Mouse as health monitoring tool aimed to alleviate the negative impact of missed appointments.
        authors:
          - Priyankar Bhattacharjee
        publisher: IEEE
        releaseDate: 2015-02-12
        url: https://www.researchgate.net/publication/265905991_The_Computer_Mouse_as_health_monitoring_tool_aimed_to_alleviate_the_negative_impact_of_missed_appointments#fullTextFileContent
        summary: Proposed a novel remote health monitoring approach that provides healthcare providers with real-time access to patient health status, thereby reducing the need for routine clinical visits. The research offers an alternative to existing reminder systems and predictive algorithms by enabling continuous patient monitoring that minimizes appointment-based care dependencies and associated no-show rates.

